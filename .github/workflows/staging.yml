name: Publish staging image
on:
  push:
    branches:
      - master
    tags:
      - '!**'
  workflow_dispatch:
jobs:
  build-push:
    environment: staging
    runs-on:
      group: self-hosted
    if: contains(github.event.head_commit.message, 'Back to development:') == false && contains(github.event.head_commit.message, 'Preparing release') == false
    steps:
      - name: Build push and notify
        uses: IMIO/gha/build-push-notify@v4
        with:
          IMAGE_NAME: ${{ vars.IMAGE_NAME }}
          IMAGE_TAGS: |
            ${{ secrets.HARBOR_URL }}/${{ vars.IMAGE_NAME }}:staging
            ${{ secrets.HARBOR_URL }}/${{ vars.IMAGE_NAME }}:staging-${{ github.run_number }}
          REGISTRY_URL: ${{ secrets.HARBOR_URL }}
          REGISTRY_USERNAME: ${{ secrets.DOCS_HARBOR_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.DOCS_HARBOR_PASSWORD }}
          MATTERMOST_WEBHOOK_URL: ${{ secrets.DOCS_MATTERMOST_WEBHOOK_URL }}
  trivy-fs:
    name: Filesystem scan
    runs-on:
      group: self-hosted
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: IMIO/gha/trivy-scan-notify@v8
        with:
          SCAN_TYPE: fs
          TRIVYIGNORES: ''  # no .trivyignore in this repo: the action default would fail
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MATTERMOST_WEBHOOK_URL: ${{ secrets.DOCS_MATTERMOST_WEBHOOK_URL }}
  # The image scan also covers the buildout eggs, which a filesystem scan of the repo cannot see.
  trivy-image:
    name: Image scan
    needs: build-push
    runs-on:
      group: self-hosted
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: IMIO/gha/trivy-scan-notify@v8
        with:
          SCAN_TYPE: image
          IMAGE_REF: ${{ secrets.HARBOR_URL }}/${{ vars.IMAGE_NAME }}:staging-${{ github.run_number }}
          TRIVY_USERNAME: ${{ secrets.DOCS_HARBOR_USERNAME }}
          TRIVY_PASSWORD: ${{ secrets.DOCS_HARBOR_PASSWORD }}
          TRIVYIGNORES: ''  # no .trivyignore in this repo: the action default would fail
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MATTERMOST_WEBHOOK_URL: ${{ secrets.DOCS_MATTERMOST_WEBHOOK_URL }}
