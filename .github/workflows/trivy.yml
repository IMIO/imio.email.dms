name: Trivy scan of the production image
# Releases are months apart: rescan the deployed image weekly so new CVEs are caught in between.
on:
  schedule:
    - cron: '0 4 * * 1'  # Every Monday at 04:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  trivy-image:
    name: Image scan
    runs-on:
      group: self-hosted
    steps:
      - uses: IMIO/gha/trivy-scan-notify@v8
        with:
          SCAN_TYPE: image
          IMAGE_REF: ${{ secrets.HARBOR_URL }}/${{ vars.IMAGE_NAME }}:${{ vars.IMAGE_TAG_PRODUCTION }}
          SARIF_CATEGORY: trivy-image-production
          TRIVY_USERNAME: ${{ secrets.DOCS_HARBOR_USERNAME }}
          TRIVY_PASSWORD: ${{ secrets.DOCS_HARBOR_PASSWORD }}
          TRIVYIGNORES: ''  # no .trivyignore in this repo: the action default would fail
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MATTERMOST_WEBHOOK_URL: ${{ secrets.DOCS_MATTERMOST_WEBHOOK_URL }}
